kind = "web"
previewPath = "/"
title = "Maa Durga · Dussehra Story"
description = "A professional, illustrated Dussehra story experience with a hand-traced code drawing of Maa Durga and her lion, regional festival context, and interactive chapters."
version = "1.0.0"
id = "artifacts/durga-dussehra-story"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25092

[services.development]
run = "pnpm --filter @workspace/durga-dussehra-story run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/durga-dussehra-story", "run", "build" ]
serve = "static"
publicDir = "artifacts/durga-dussehra-story/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25092"
BASE_PATH = "/"
